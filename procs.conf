# Heartbeat-uri: cadenta pe NOAPTE verificata (14 iul: kraken_cache ~30s, kraken_bot ~2min,
# t212_bot ~10s, trail_k ~2min, xstock ~3min) -> thresholds with a 5-10x margin. Binance trailing
# has NO heartbeat INTENTIONALLY: its stdout is block-buffered (mtime can sit HOURS behind)
# -> it would report a false HUNG and restart for nothing; it stays on presence only (pgrep).
kraken_cachemanager.py|$ROOT/kraken|nohup python3 kraken_cachemanager.py >> kraken_cachemanager.log 2>&1 &|Kraken-cache|kraken_cachemanager.log|600|bot
kraken_bot.py$|$ROOT/kraken|nohup python3 kraken_bot.py >> kraken_bot.log 2>&1 &|Kraken-HYPE|kraken_bot.log|900|bot
kraken_bot.py --pair TAOUSD|$ROOT/kraken|nohup python3 kraken_bot.py --pair TAOUSD >> kraken_bot.log 2>&1 &|Kraken-TAO|kraken_bot.log|900|bot
kraken_bot.py --pair ADAUSD|$ROOT/kraken|nohup python3 kraken_bot.py --pair ADAUSD >> kraken_bot.log 2>&1 &|Kraken-ADA|kraken_bot.log|900|bot
kraken_xstock_watch.py|$ROOT/kraken|nohup python3 kraken_xstock_watch.py >> kraken_xstock_watch.log 2>&1 &|xStock-watch|kraken_xstock_watch.log|1800|bot
t212_bot.py|$ROOT/212trading|nohup python3 t212_bot.py >> ../logs/t212_bot.log 2>&1 &|T212-bot|../logs/t212_bot.log|900|bot
kraken/trailing_stop.py|$ROOT|nohup python3 kraken/trailing_stop.py >> kraken/trail_k.log 2>&1 &|Kraken-trailing|kraken/trail_k.log|900|bot
binance_api/trailing_stop.py|$ROOT|source $ROOT/$VENV/bin/activate && nohup python3 binance_api/trailing_stop.py >> binance_api/trail_b.log 2>&1 &|Binance-trailing|||bot

