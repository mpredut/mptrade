# procs.conf — THE SINGLE INVENTORY of supervised processes (bots + fleet).
# THE SINGLE source of truth. Read by:  restart_bots.sh, fleet_supervisor.sh, healthcheck.sh.
# You add / remove / change a process -> HERE, in a SINGLE place (no longer in 3).
#
# Format (fields separated by '|'):  pat | dir | start_cmd | label | hb_log | hb_stale_s | role
#   pat        - the pgrep -f pattern (the process). A trailing '$' = the cmdline ends there.
#   dir        - the working directory for starting it ($ROOT is expanded by each consumer).
#   start_cmd  - the start command (run through eval, without 'cd' — the consumer cds into dir;
#                $ROOT/$VENV are expanded at run time). For role=fleet it may be EMPTY (see below).
#   label      - short name (logs/alerts + backoff key).
#   hb_log     - optional HEARTBEAT: file or comma-separated list (e.g., logs/HL-bot.log or
#                cachedb/rtrade.heartbeat,logs/rtrade.log). If multiple, ALL must indicate life.
#                Empty = a presence check only (pgrep).
#   hb_stale_s - threshold in seconds: process alive BUT its log older than this = HUNG. Empty = no heartbeat.
#   role       - bot   : started by restart_bots.sh; restarted (absent/HUNG) by healthcheck --supervise.
#                fleet : started plus supervised by fleet_supervisor.sh (its own loop, venv plus logs/);
#                        healthcheck ONLY alerts (it does not restart). For fleet, start_cmd is EMPTY —
#                        fleet_supervisor knows how to start the script ($pat) with its own logic.
#
# The ORDER matters at startup (e.g. cacheManager BEFORE trading bots, so that price/fills files exist).
# Lines starting with '#' and empty lines are ignored. Do NOT indent the fields.

