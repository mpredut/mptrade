# order_guard.conf — mandatory profit guard and pre-trade risk configuration per venue/module.
# Read at startup by order_guard._load_margins(). Missing or invalid keys abort startup.

default = 1.15
binance = 1.15
kraken  = 1.15

# The window (hours) for the min/max time-windowed tier, per venue: the key <venue>_window_h.
# On a BUY -> min(sell) in the window; on a SELL -> max(buy). 0 = no tier (only the last
# opposite fill). Binance uses its own Order cache with safeback_seconds (12-14 days in practice,
# passed per-call by monitortrades/tradeall).
# 30 Jul: kraken_window_h 48h -> 336h (14 days) — UNIFIED with Binance's effective window.
default_window_h = 0
kraken_window_h  = 336

# Dynamic lookback window settings for the profit reference (hours), symmetric for BUY and SELL.
# Adapts the historical reference window based on market trend/regime relative to order side:
# - Favorable trend (BUY in bull / SELL in bear): short window (4h - 12h, default 8h)
#   allows riding sustained moves while protecting against immediate reversals.
# - Flat / chop / unknown: medium window (12h - 48h, default 24h) for swing ranges.
# - Adverse trend (BUY in bear / SELL in bull): wide defensive window (48h - 168h, default 72h)
#   to prevent catching falling knives on BUY or selling prematurely during a bull run.
dynamic_window_favorable_h = 8
dynamic_window_flat_h      = 24
dynamic_window_adverse_h   = 72

# ==============================================================================
# Financial Profit Reference Difficulty Tiers (Symmetric for BUY and SELL)
# ==============================================================================
# All active levels require at least +1.15% profit margin vs the chosen reference:
#   - "hybrid"  (Level 1 - Easy/Smart) : SELL -> min(VWAP_14d, last_buy)  | BUY -> max(VWAP_14d, last_sell)
#   - "last"    (Level 2 - Permissive) : SELL -> last_buy                 | BUY -> last_sell
#   - "average" (Level 3 - Moderate)   : SELL -> VWAP_14d (avg buy cost)  | BUY -> VWAP_14d (avg sell price)
#   - "strict"  (Level 4 - Hard/Max)   : SELL -> max(BUY_14d)             | BUY -> min(SELL_14d)
#   - "dynamic" (Adaptive Window)      : Regime-aware lookback window (8h bull, 24h flat, 72h bear)
#   - "off"     (Level 0 - Disabled)   : off — disables historical price reference check
#
# 1) Per-Provider / Per-Venue defaults (<venue>_buy_reference / <venue>_sell_reference):
default_buy_reference  = strict
binance_buy_reference  = dynamic
kraken_buy_reference   = strict

default_sell_reference = strict
binance_sell_reference = hybrid
kraken_sell_reference  = strict

# 2) Per-Module / Per-Bot overrides (<module>_buy_reference / <module>_sell_reference,
#    or <venue>_<module>_<side>_reference for venue+module specificity).
#    Set to "venue" to inherit the provider's mode above, or set any
#    difficulty tier directly (hybrid | last | average | strict | dynamic | off):
assetguardian_buy_reference  = venue
assetguardian_sell_reference = hybrid
monitortrades_buy_reference  = venue
monitortrades_sell_reference = venue
tradeall_buy_reference       = venue
tradeall_sell_reference      = venue
rtrade_buy_reference         = venue
rtrade_sell_reference        = venue

# A trend proxy for the WEIGHT (gauss) when the symbol has no LONG trend of its own (e.g. HYPEUSD on
# Kraken until its trend is computed). It uses another symbol's gauss curve (BTC = beta
# of the market). The key is <venue>_weight_proxy or default_weight_proxy. No proxy -> default 0.03.
kraken_weight_proxy = BTCUSDC
binance_weight_proxy = BTCUSDC
default_weight_proxy = BTCUSDC

# Conservative fallback weight when neither the symbol nor proxy has an active long trend (chop/range).
default_chop_weight = 0.03
binance_chop_weight = 0.03
kraken_chop_weight  = 0.03

# 30 Jul: a daily cap plus anti-spam (the agnostic equivalent of if_place_safe_order in
# Binance) — now shared, through Instrument.place(), for any provider that does NOT guard internally
# (Binance stays on its own, older implementation, with its own data — see
# bapi_placeorder_config.env). The key is <venue>_xxx or default_xxx.
# max_daily_trades: a cap on trades per day (relative to safeback_sec) before a "daily_limit" refusal.
default_max_daily_trades = 25
# safeback_sec: the window (seconds) in which trades are searched for the daily cap and
# profit guard reference. 30 Jul: 48h -> 14 days (unified with Binance/monitortrades/tradeall).
default_safeback_sec = 1209660   # 14 days + 60s

# recent_transaction_sec: anti-spam temporal window (seconds) that rejects a rapid-fire
# same-symbol trade if a previous trade occurred within this cutoff window.
# Can be configured globally via default_recent_transaction_sec, per venue via
# <venue>_recent_transaction_sec, or per side via default_recent_transaction_buy_sec
# / default_recent_transaction_sell_sec. Set <= 0 to disable.
default_recent_transaction_sec = 90

# recent_transaction_side: side(s) on which the recent_transaction anti-spam filter is enforced.
# Options (strictly validated at init):
#   - "buy"  : Only rapid-fire BUY orders are rejected if a recent BUY trade exists.
#   - "sell" : Only rapid-fire SELL orders are rejected if a recent SELL trade exists.
#   - "both" : Symmetric mode (both BUY and SELL orders are rejected if a recent trade on that same side exists).
#   - "off"  : Disabled for all sides.
# Can be configured globally via default_recent_transaction_side or per venue via <venue>_recent_transaction_side.
default_recent_transaction_side = buy

# Maximum age (seconds) for a pre-computed MarketRegimeContext before fresh resolution
regime_context_max_age_sec = 120

# ==============================================================================
# PRE-TRADE QUANTITATIVE, MICROSTRUCTURE & LLM GUARDS
# ==============================================================================

# G_QLIMIT2: Internal Quantitative Mathematical Guards (qlimit_order_guard.py)
# Anti-FOMO Parabolic surge & Weibull trend survival exhaustion (0 ms in-memory)
# Mode: "off" | "shadow" (observational dry-run logging) | "enforce" (actively block/downscale)
internal_guard_mode = enforce
intelligence_guards_mode = enforce
parabolic_surge_pct = 15.0
parabolic_pullback_pct = 2.0
weibull_exhaustion_policy = downscale
weibull_exhausted_scale = 0.25
weibull_p90_days = 7.0

# GI_OBOOK, GI_WHALE, GI_FUNDING: External Microstructure & Derivatives Guards (external_order_guard.py)
# Spot Orderbook Depth / Ask Walls, Derivatives Funding Crowding, Whale Flow (0 ms local cache, NO LLM)
# Mode: "off" | "shadow" (observational dry-run logging) | "enforce" (actively block/downscale)
external_guard_mode = enforce
microstructure_guard_mode = enforce
whale_guard_mode = enforce
severe_cascade_oi_pct = -5.0
min_taker_ratio = 0.75
taker_downscale_threshold = 0.90
taker_downscaled_scale = 0.50
orderbook_wall_guard_mode = enforce
whale_wall_usd_limit = 1000000.0
min_buy_imbalance = 0.25
max_sell_imbalance = 0.75
sell_guard_min_notional_usd = 700.0
funding_guard_mode = enforce
funding_max_long_rate = 0.0005
funding_min_short_rate = -0.0005
funding_crowding_policy = downscale
funding_crowded_scale = 0.50

# External Sub-Module: Smart Liquidity-Aware Stop Loss (Anti-Wick Hunt & Whale Absorption)
# Protects tight stop loss orders (<= 6.0%) from predatory liquidity sweeps; wide 20-30% stops bypass immediately.
smart_sl_mode = enforce
smart_sl_max_threshold_pct = 6.0
smart_sl_grace_seconds = 120.0
smart_sl_disaster_buffer_pct = 0.85
smart_sl_min_whale_long_pct = 0.60
smart_sl_min_taker_ratio = 0.85

# GLLM1 & GLLM2: LLM High-Stake Guard & Sentiment Advisor (llm_order_guard.py & high_stake_guard.py)
# Pre-trade high-stake purchase risk vetting via LLM (BUY & large SELL >= 700 USD)
# Mode: "off" | "shadow" (logs AI evaluation without blocking) | "enforce" (actively vetoes or downscales)
llm_guard_mode = enforce
llm_min_notional_eur = 700.0
llm_timeout_sec = 25.0
llm_fallback = allow

# GLLM1 Sub-Module: Post-Stop Re-entry AI Validator (post_stop_reentry_guard.py)
# Vets post-stop technical bounce recoveries against dead-cat bounces, bull traps, and whale distribution
post_stop_reentry_mode = enforce
post_stop_reentry_timeout_sec = 25.0
post_stop_reentry_fallback = allow
post_stop_reentry_notify = 1
post_stop_reentry_cache_ttl_sec = 900.0

# GLLM2: Periodic Sentiment Advisor cadence (sentiment_advisor_eval.json, background cycle: 3.0 hours via LLM)
sentiment_advisor_interval_h = 3.0
sentiment_advisor_interval_sec = 10800.0
macro_advisor_interval_h = 3.0
macro_advisor_interval_sec = 10800.0

# GLLM3: Geopolitical threat LLM analysis interval (macro_analyzer.py background cycle: 4.5 hours via LLM)
macro_llm_interval_h = 4.5
macro_llm_interval_sec = 16200.0

# GLLM3: Geopolitical & Macro Shock Shield (llm_order_guard.py)
# Black Swan armed conflict / energy crisis vetoes (< 1 ms local cache, evaluated by LLM)
# Mode: "off" | "shadow" (logs threat assessment without blocking) | "enforce" (actively vetoes on CRITICAL_SHOCK)
geopolitical_guard_mode = enforce

# Real-Time Shadow Alerting via ntfy (Phone Notifications for AI reasoning)
# Set to 1 to receive live push alerts on phone when guards flag orders in shadow mode
shadow_notify = 1

# Autonomous AI Nightly Supervisor (orchestratorOS/supervisor/autonomous_ai_reconciler.py)
# Mode: "shadow" (audits logs, diagnoses issues, simulates corrections, notifies via ntfy) | "enforce"
supervisor_mode = enforce
supervisor_notify = 1

# Autonomous AI Trading Gateway (orchestratorTrade/autonomous_intent_gateway.py)
# Mode: "shadow" (validates guards, logs simulated buy/sell, sends ntfy) | "enforce" (places order via Instrument.place())
autonomous_trading_mode = enforce
autonomous_trading_max_notional_eur = 500.0
autonomous_trading_min_notional_eur = 10.0
autonomous_trading_min_confidence = 0.85
autonomous_trading_dedup_window_sec = 21600.0
autonomous_trading_notify = 1

# ==============================================================================
# CONFIGURABLE GUARD GATES PER ORDER / VENUE (bypass_guards)
# ==============================================================================
# Allows configuring which guards / gates are bypassed for orders by default:
# Options: "none" | comma-separated list of:
#   "GO1", "GT_S", "GT_M", "GT_L", "G_PROF", "G_QLIMIT1", "G_QLIMIT2",
#   "GI_OBOOK", "GI_WHALE", "GI_FUNDING", "GLLM1", "GLLM2", "GLLM3", "all"
default_bypass_guards = none
binance_bypass_guards = none
kraken_bypass_guards  = none

