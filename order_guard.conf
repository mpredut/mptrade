# order_guard.conf — the MINIMUM profit threshold (%) for the profit guard, per venue.
# Read by order_guard.margin_for(provider). Format:  <provider> = <percentage>
# (lowercase names as in provider.name; 'default' = the fallback when the venue is not listed).
# A missing file or an invalid value -> the default of 1.15 (fail-safe). Changing it requires
# a bot restart (the value is cached on first read).

default = 1.15
binance = 1.15
kraken  = 1.15

# The window (hours) for the min/max time-windowed tier, per venue: the key <venue>_window_h.
# On a BUY -> min(sell) in the window; on a SELL -> max(buy). 0 = no tier (only the last
# opposite fill). Binance does NOT use this (it has an internal guard in bapi with its own Order cache,
# pe safeback_seconds = 12-14 zile in practica, trecut per-apel de monitortrades/tradeall).
# 30 Jul: kraken_window_h 48h -> 336h (14 days) — UNIFIED with Binance's effective window
# (a user request, "all of them at the large value"). A longer window = a more conservative
# profit reference (min sell / max buy over 14 days, not 2). The Kraken cache is 14 days INTENTIONALLY
# (rate limits), so the window matches the data available. A real change of
# comportament pe Kraken/HYPE — revenire: pune inapoi 48.
default_window_h = 0
kraken_window_h  = 336

# Dynamic lookback window settings for the BUY profit reference (hours).
# Adapts the historical reference window based on market trend/regime:
# - BULL trend: short window (4h - 12h, default 8h) allows riding sustained rallies
#   while still protecting against immediate top-rebuy within hours of taking profit.
# - FLAT / CHOP: medium window (24h - 48h, default 24h) for swing ranges.
# - BEAR trend: wide defensive window (48h - 168h, default 72h, up to 168h/7 days)
#   to prevent catching falling knives.
buy_window_mode   = dynamic
buy_window_bull_h = 8
buy_window_flat_h = 24
buy_window_bear_h = 72

# The historical BUY reference per venue: <venue>_buy_reference = dynamic (uses
# dynamic regime-aware lookback window: 4h-12h bull, 24h-48h flat, 48h-168h bear),
# 1 (always on), or 0 (off). 24 Sep 2026: set to dynamic for Binance.
# The SELL reference (sell only above the highest buy) and the quantity/weight guards stay active.
default_buy_reference = 1
binance_buy_reference = dynamic

# A trend proxy for the WEIGHT (gauss) when the symbol has no LONG trend of its own (e.g. HYPEUSD on
# Kraken until its trend is computed). It uses another symbol's gauss curve (BTC = beta
# of the market). The key is <venue>_weight_proxy or default_weight_proxy. No proxy -> default 0.03.
kraken_weight_proxy = BTCUSDC

# 30 Jul: a daily cap plus anti-spam (the agnostic equivalent of if_place_safe_order in
# Binance) — now shared, through Instrument.place(), for any provider that does NOT guard internally
# (Binance stays on its own, older implementation, with its own data — see
# bapi_placeorder_config.env). The key is <venue>_xxx or default_xxx.
# max_daily_trades: a cap on trades per day (relative to safeback_sec) before a "daily_limit" refusal.
default_max_daily_trades = 25
# safeback_sec: the window (seconds) in which trades are looked for, for the daily cap plus
# referinta gardului de profit. 30 iul: 48h -> 14 zile (unificat "tot la valoarea mare",
# as Binance/monitortrades/tradeall's effective window).
default_safeback_sec = 1209660   # 14 zile + 60s
default_recent_transaction_sec = 180

# Intelligence guards (Anti-FOMO Parabolic surge & Weibull trend exhaustion)
# Mode: "off" | "shadow" (observational dry-run logging) | "enforce" (actively block/downscale)
intelligence_guards_mode = shadow
parabolic_surge_pct = 15.0
parabolic_pullback_pct = 2.0
weibull_exhaustion_policy = downscale
weibull_exhausted_scale = 0.25

# Google Gemini LLM High-Stake Guard (> 1000 EUR)
# Pre-flight risk reasoning using authenticated Google Gemini subscription before placing large BUY orders.
# Mode: "off" | "shadow" (logs Gemini evaluation without blocking) | "enforce" (actively vetoes or downscales)
gemini_guard_mode = shadow
gemini_min_notional_eur = 1000.0
gemini_timeout_sec = 12.0
gemini_fallback = allow

# Geopolitical & Energy Shock Guard (Black Swan Shield)
# Mode: "off" | "shadow" (logs threat assessment without blocking) | "enforce" (actively vetoes on CRITICAL_SHOCK)
geopolitical_guard_mode = shadow

# Pillar 2: External Whale Flow, Orderbook Microstructure & Derivatives Guards
# Mode: "off" | "shadow" (observational dry-run logging) | "enforce" (actively block/downscale)
whale_guard_mode = shadow
orderbook_wall_guard_mode = shadow
whale_wall_usd_limit = 1000000.0
min_buy_imbalance = 0.25
funding_guard_mode = shadow
funding_max_long_rate = 0.0005
funding_crowding_policy = downscale
funding_crowded_scale = 0.50

# Real-Time Shadow Alerting via ntfy (Phone Notifications for AI reasoning)
# Set to 1 to receive live push alerts on phone when Gemini or Macro guards flag orders in shadow mode
shadow_notify = 1

