# Mandatory Hyperliquid spot trailing-stop configuration.
# External environment values may override these settings for ad-hoc testing.
# Per-coin membership, pair, trailing.pct, and trailing.rebuy are defined in
# instruments.conf (provider = hyperliquid, role.trailing = yes), symmetric with Binance & Kraken.
# SAFETY: starts in DRY-RUN (false) until verified on live telemetry and explicitly enabled.
HL_TRAILING_ENABLED=false
HL_TRAILING_CHECK_SECONDS=60
HL_TRAILING_MARKET=true

HL_TRAILING_DEFAULT_PCT=25
HL_TRAILING_MIN_NOTIONAL_USD=10
# Rebuy only after price rebounds from the post-sale low.
HL_TRAILING_REBUY_ENABLED=true
HL_TRAILING_REBUY_BOUNCE_PCT=1.2
# Completed daily candles for trailing.rebuy = auto SMA filter (1..999).
HL_TRAILING_REBUY_TREND_DAYS=100
# Explicit trend-gate policy. Neutral or unknown trend remains a no-op.
HL_TRAILING_REBUY_SKIP_IF_TREND_DOWN=true
HL_TRAILING_SELL_SKIP_IF_TREND_UP=true
HL_TRAILING_SELL_TREND_DEFER_MAX_SEC=420
# Trailing activates only after this minimum profit percentage.
HL_TRAILING_MIN_PROFIT_PCT=5.0
