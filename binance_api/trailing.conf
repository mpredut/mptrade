# trailing.conf — config trailing stop Binance (binance_api/trailing_stop.py)
# Change things HERE; do not put variables in bots_start.sh any more.
# An env var set from outside OVERRIDES the config (for an ad-hoc test: TRAILING_ENABLED=false python3 ...).

TRAILING_ENABLED=true
TRAILING_SELL_FRACTION=1.0
TRAILING_CHECK_SECONDS=60

# Re-buy after a crash stop-loss: buy back when the price recovers BOUNCE_PCT% from the post-sale low.
# TRAILING_REBUY_ENABLED here is only the fallback for a symbol NOT in the registry;
# per-coin the switch is instruments.conf `trailing.rebuy = on|off|auto`.
TRAILING_REBUY_ENABLED=true
TRAILING_REBUY_BOUNCE_PCT=1.2
TRAILING_REBUY_TRANCHES=1
# Completed daily candles for auto re-buy's SMA; supported range is 1..999.
# Only the average is cached, until the next UTC day. Current price is rechecked.
# This is a distinct long-horizon policy, not proof that 100 days beats other windows.
TRAILING_REBUY_TREND_DAYS=100

# Short trend filters (read from cache_short_trend through cacheManager).
# REBUY_SKIP_IF_TREND_DOWN=true  -> do not buy back in a clear downtrend (no catching the knife)
TRAILING_REBUY_SKIP_IF_TREND_DOWN=true

# The minimum profit threshold (%) before the trailing activates.
# 0 = active immediately after the buy (the old behaviour).
# 5 = the trailing starts only once the price is 5% above the initially observed price.
# It prevents selling at a loss on a normal dip in the first days after the buy.
TRAILING_MIN_PROFIT_PCT=5.0
