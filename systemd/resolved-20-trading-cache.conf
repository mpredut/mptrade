[Resolve]
# Authoritative DNS: force 1.1.1.1/8.8.8.8 for ALL lookups (Domains=~.) so a DHCP/hotspot
# server cannot inject its own resolver and cause intermittent resolution failures ("the box
# keeps dropping"). When the VPN is up, tun0's own DNS is preferred for ~. (link scope), so
# this does not fight the tunnel. resolv.conf stays the systemd-resolved stub (caching kept).
DNS=1.1.1.1 8.8.8.8
FallbackDNS=1.1.1.1 8.8.8.8 1.0.0.1
Domains=~.
Cache=yes
StaleRetentionSec=4h
