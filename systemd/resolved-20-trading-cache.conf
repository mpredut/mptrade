[Resolve]
# DNS under PIA WireGuard + killswitch.
#
# When the tunnel (wgpia0) is up, PIA pushes its own resolver (10.0.0.243) with a
# catch-all routing domain (Domains=~.), and PIA leak protection REFUSES any external
# DNS -- a query to 1.1.1.1/8.8.8.8:53 returns "connection refused". So we must NOT pin
# a Global DNS here. The previous drop-in set Global DNS=1.1.1.1 8.8.8.8 with Domains=~.,
# which then competed with wgpia0 for every lookup; because those servers are blocked,
# resolution failed intermittently (the fleet resolved api.binance.com only some of the
# time). We now let the tunnel's own DNS own all resolution and keep only the cache tuning.
#
# When the tunnel is DOWN the killswitch blocks all traffic anyway, so having no public
# resolver at that moment is harmless: the fleet cannot reach Binance either way and its
# VPN gate holds it until the tunnel is back.
#
# FallbackDNS is a genuine last resort only (systemd-resolved consults it solely when no
# other DNS server is configured), so it never competes with the tunnel resolver.
#
# DNS= is pinned EMPTY on purpose (belt-and-suspenders): an explicit empty assignment
# resets any Global resolver accumulated from config read before this drop-in and
# documents that resolution is owned entirely by the per-link (tunnel wgpia0) DNS. Never
# put servers here -- a Global DNS is exactly the pin that fought the tunnel and caused
# the intermittent failures.
DNS=
FallbackDNS=1.1.1.1 8.8.8.8 1.0.0.1
Cache=yes
StaleRetentionSec=4h
