# Keeps the Web UI conversation list stable across restarts and reboots.
# pre : daemon stopped - real files live in ~/.gemini/antigravity/conversations (source 0 = visible in the UI)
# post: after the daemon finished its startup scan - hard-link them back into ~/.gemini/antigravity-cli/conversations
#       so the conversation content can be opened. Runs in the background so the unit is active immediately.
[Service]
ExecStartPre=-/usr/bin/python3 @TRADING_ROOT@/orchestratorOS/admin/agy_store_fix.py pre
ExecStartPost=-/bin/sh -c '/usr/bin/python3 @TRADING_ROOT@/orchestratorOS/admin/agy_store_fix.py post >/dev/null 2>&1 &'
