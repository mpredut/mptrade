# Mirror of /etc/netplan/99-force-gateway.yaml on the trading VM (installed 0600 root by
# install_prod.sh). Forces the VM's uplink DIRECTLY to the router 192.168.0.1 instead of
# whatever gateway DHCP hands out: the LAN DHCP has handed out the Proxmox host (.2) as the
# default gateway, which makes the VM hairpin through the host and breaks the addKey to
# PIA's dedicated IP. use-routes:false ignores the DHCP-provided routes/gateway; the static
# default pins .1. Depends on cloud-init's 50-cloud-init.yaml providing `dhcp4: true` for
# ens18 (that file is regenerated by cloud-init, so it is NOT mirrored here).
#
# CAUTION: `netplan apply` while PIA is connected WIPES PIA's policy routing (piavpnWgrt);
# rebuild it with `piactl connect` / `systemctl restart pia.service`. On a clean reboot the
# order (netplan first, then pia.service) is safe. See systemd/DISASTER_RECOVERY.md.
network:
  version: 2
  ethernets:
    ens18:
      dhcp4-overrides:
        use-routes: false
      routes:
        - to: default
          via: 192.168.0.1
