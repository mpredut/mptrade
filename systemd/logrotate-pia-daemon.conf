# Cap PIA's debug daemon log so `piactl set debuglogging true` (left ON in production for
# diagnostics) cannot fill the disk. Installed to /etc/logrotate.d/pia-daemon by
# install_prod.sh; logrotate's daily cron enforces the cap.
#
# copytruncate is REQUIRED: the pia-daemon holds daemon.log open, so we copy-then-truncate
# in place. A plain rename would leave PIA writing to the old (now-unlinked) inode, so the
# live log would look empty and the disk would still fill.
#
# Bound: at most ~20M live + 3 compressed rotations -> a few tens of MB total, forever.
/opt/piavpn/var/daemon.log {
    size 20M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
