# Canonical chrony configuration for mptrade hosts (PROD & DEV).
# Installed to /etc/chrony/chrony.conf by systemd/install_clock_sync.sh.
#
# Uses strictly non-smearing Stratum-1/2 UTC servers (never mix smearing sources like
# time.google.com with standard UTC pools) with tight polling (16s-64s) to keep local
# wall-clock offset sub-millisecond across all venues (Binance, Kraken, Hyperliquid, T212).
#
# makestep is bounded to the first 3 boot updates only; during live trading chrony slews
# smoothly so monotonic caches, watchdogs, and order timers never jump backward.

server time.cloudflare.com iburst minpoll 4 maxpoll 6
pool   ro.pool.ntp.org     iburst minpoll 4 maxpoll 6 maxsources 3
pool   europe.pool.ntp.org iburst minpoll 4 maxpoll 6 maxsources 2

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony

confdir /etc/chrony/conf.d

maxupdateskew 100.0
maxdistance 1.0
makestep 0.1 3
rtcsync
leapsectz right/UTC
