# Disable IPv6 on physical and default interfaces so ISP SLAAC/RA prefixes
# (e.g. DIGI public 2a02:2f01::/64) are never assigned outside the IPv4 VPN tunnel.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.ens18.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 0
