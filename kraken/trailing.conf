# Mandatory Kraken trailing-stop configuration. External environment values may
# override these settings only for an explicit ad-hoc test.
KRAKEN_TRAILING_ENABLED=true
KRAKEN_TRAILING_CHECK_SECONDS=120
KRAKEN_TRAILING_HYPE_PCT=18
KRAKEN_TRAILING_HYPE_PAIR=HYPEUSD
KRAKEN_TRAILING_DEFAULT_PCT=15
KRAKEN_TRAILING_MIN_NOTIONAL_USD=10
# Rebuy only after price rebounds from the post-sale low.
KRAKEN_TRAILING_REBUY_ENABLED=true
KRAKEN_TRAILING_REBUY_BOUNCE_PCT=1.2
# Explicit trend-gate policy. Neutral or unknown trend remains a no-op.
KRAKEN_TRAILING_REBUY_SKIP_IF_TREND_DOWN=true
# Trailing activates only after this minimum profit percentage.
KRAKEN_TRAILING_MIN_PROFIT_PCT=5.0
