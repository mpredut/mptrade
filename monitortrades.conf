# ============================================================================
# monitortrades.conf — parametri GLOBALI reglabili pt monitortrades.py. Text simplu.
# A missing file OR a missing key => the defaults in the code are used.
#
# 23 Jul: the per-symbol lines (SYMBOL = gain%/lost%/maxage_days) were removed, as they
# used to live here — they were parsed but NEVER read (SYMBOL_PARAMS was dead, confirmed
# by grep). The REAL per-instrument source is instruments.conf (the mt.* namespace,
# sectiunile [BINANCE_BTC]/[BINANCE_TAO]/etc, mt.gain/mt.lost/mt.maxage_days) —
# edit there, not here, to change gain/lost/maxage per symbol.
# ============================================================================

# --- HARD TP (sell a fraction on a large gain, REGARDLESS of the trend) ---
# hard_tp_pct/fraction/cooldown_h de mai jos sunt FALLBACK global — folosite
# only by the instruments in instruments.conf that do NOT set mt.hardtp*
# (today: BTC/TAO/HYPE set them explicitly; T212_SPCX/NVDA/RGNT do NOT, so they would
# use these values if it were enabled=yes).
hard_tp_enabled    = yes
hard_tp_pct        = 17     # the % gain vs the reference at which it fires
hard_tp_fraction   = 0.5    # How much it sells (0.5 = 50% of the free balance).
hard_tp_cooldown_h = 6      # The minimum hours between two hard TPs.

# --- Price reference for the gain: last (the last buy) | average (the mean over maxage days) ---
tp_reference = last

# --- MHDSL BOUNCE PROTECTION (Proposals 2 & 3) ---
# sl_trend_defer_max_s: maximum duration to defer SL when trend is up (~3.7 min = 220s)
sl_trend_defer_max_s       = 220
# sl_bounce_min_recovery_pct: minimum bounce recovery (0.4%) before arming rollover detection
sl_bounce_min_recovery_pct = 0.4
# sl_bounce_pullback_pct: pullback from bounce peak (0.3%) that triggers rollover exit
sl_bounce_pullback_pct     = 0.3

# --- MHDSL PARALLEL DISASTER FLOOR (Proposal 1: Variant A + Variant B) ---
# sl_disaster_buffer_ratio: Variant A - proportional to SL (0.30 = 30% of lost_threshold)
sl_disaster_buffer_ratio   = 0.30
# sl_disaster_vol_multiplier: Variant B - multiplier for realized 1h volatility (1.5x)
sl_disaster_vol_multiplier = 1.5
# sl_disaster_buffer_min_pct: minimum safety buffer percentage (0.50%)
sl_disaster_buffer_min_pct = 0.5



# --- MDHTP PROFIT RIDING & PEAK PROTECTION (Take-Profit in Mirror) ---
# tp_trend_ride_enabled: amana vanzarea pe trend ascendent pentru a lasa profitul sa creasca (default yes)
tp_trend_ride_enabled      = yes
# tp_pullback_pct: retragerea de la varful de gain (peak) care declanseaza vanzarea pe epuizare de raliu (0.6% = 0.006)
tp_pullback_pct            = 0.6
# tp_profit_floor_ratio: procentul din gain_threshold garantat ca floor (0.50 = 50% din gain_threshold)
tp_profit_floor_ratio      = 0.50
# tp_profit_floor_min_pct: profitul minim absolut garantat pentru a nu lasa pozitia sa coboare (0.8% = 0.008)
tp_profit_floor_min_pct    = 0.8
# tp_stagnation_max_s: durata maxima de amânare pe trend up daca pretul nu mai atinge noi varfuri (18 min = 1080s)
tp_stagnation_max_s        = 1080
