# ============================================================================
# monitortrades.conf — mandatory global parameters for monitortrades.py.
# A missing file OR a missing/invalid key aborts startup immediately.
#
# Per-instrument settings live exclusively in instruments.conf (the mt.* namespace:
# [BINANCE_BTC]/[BINANCE_TAO]/etc, mt.gain/mt.lost/mt.maxage_days).
# ============================================================================

# --- HARD TP (disabled: MDHTP trend-riding + dynamic volatility-anomaly ratchet handles spikes without selling against trend or cooldowns) ---
hard_tp_enabled    = no
hard_tp_pct        = 17
hard_tp_fraction   = 0.5
hard_tp_cooldown_h = 6

# --- Price reference for the gain: last (the last buy) | average (the mean over maxage days) ---
tp_reference = last

# --- MHDSL BOUNCE PROTECTION (Proposals 2 & 3) ---
# sl_trend_defer_max_s: maximum duration to defer SL when trend is up (~3.7 min = 220s)
sl_trend_defer_max_s       = 220
# sl_bounce_min_recovery_pct: minimum bounce recovery (0.4%) before arming rollover detection
sl_bounce_min_recovery_pct = 0.4
# sl_bounce_pullback_pct: pullback from bounce peak (0.3%) that triggers rollover exit
sl_bounce_pullback_pct     = 0.3

# --- MHDSL PARALLEL DISASTER FLOOR (Proposal 1: Variant A + Variant B) ---
# sl_disaster_buffer_ratio: Variant A - proportional to SL (0.30 = 30% of lost_threshold)
sl_disaster_buffer_ratio   = 0.30
# sl_disaster_vol_multiplier: Variant B - multiplier for realized 1h volatility (1.5x)
sl_disaster_vol_multiplier = 1.5
# sl_disaster_buffer_min_pct: minimum safety buffer percentage (0.50%)
sl_disaster_buffer_min_pct = 0.5

# --- MHDSL BOUNCE RATCHET & STRUCTURAL BREAK (Dual-Variant Support) ---
# sl_bounce_ratchet_enabled: tighten pullback dynamically as the bounce climbs (yes/no)
sl_bounce_ratchet_enabled   = yes
# sl_bounce_ratchet_k: pullback tightening coefficient (0.15)
sl_bounce_ratchet_k         = 0.15
# sl_bounce_min_pullback_pct: minimum floor for tightened pullback (0.15% = 0.0015)
sl_bounce_min_pullback_pct  = 0.15
# sl_structural_break_enabled: immediate sell if bounce support is broken (yes/no)
sl_structural_break_enabled = yes

# --- MDHTP PROFIT RIDING & PEAK PROTECTION (Take-Profit in Mirror) ---
# tp_trend_ride_enabled: defer selling in an uptrend to let profit grow (yes/no)
tp_trend_ride_enabled       = yes
# tp_pullback_pct: pullback from gain peak that triggers rally-exhaustion exit (0.6% = 0.006)
tp_pullback_pct             = 0.6
# tp_ratchet_enabled: dynamically tighten pullback on out-of-pattern spikes (relative to mt.gain and vol_1h)
tp_ratchet_enabled          = yes
tp_ratchet_k                = 0.10
tp_ratchet_min_pullback_pct = 0.25
# tp_profit_floor_ratio: fraction of gain_threshold guaranteed as profit floor (0.50 = 50% of gain_threshold)
tp_profit_floor_ratio       = 0.50
# tp_profit_floor_min_pct: minimum absolute profit floor guaranteed before exit (0.8% = 0.008)
tp_profit_floor_min_pct     = 0.8
# tp_stagnation_max_s: maximum deferral duration in uptrend if price makes no new highs (18 min = 1080s)
tp_stagnation_max_s         = 1080
# reentry_hybrid_enabled: hybrid re-entry mode (yes/no)
reentry_hybrid_enabled      = no
# reentry_post_stop_cooldown_s: 0 = no clock cooldown after STOP (relies on trough bounce structure)
reentry_post_stop_cooldown_s = 0
