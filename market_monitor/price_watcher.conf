# ============================================================================
# market_alerts.conf -- configuration for the alert monitor (new coins plus price thresholds).
# Plain text, one line = one setting.  # = a comment (inline too).
# ============================================================================

# --- Watchlist: the coins tracked (ONLY these get alerts) ---
# SPCX = tokenised SpaceX (what the fetcher RESOLVES; SPCXx/xstocks do NOT resolve). HYPE is kept.
# You can also add NVDA (tokenised) etc. Non-tokenised RTH equities (RGNT, etc.) are tracked via t212_bot & AI share executor.
watch = BTC, TAO, HYPE, SPCX

# --- New-coin discovery: no = watchlist only (no alerts about brand-new coins) ---
discover_new_coins = no

# --- Sources (used only if discover_new_coins = yes) ---
sources = coinmarketcap, coingecko

# --- Alert thresholds:  NAME = UP% / DOWN% ---
#   UP%   = alert when the price has RISEN X% above the 24h LOW
#   DOWN% = alert when the price has FALLEN X% below the 24h HIGH
default  = 4.1 / 7.5      # the normal coins (without their own threshold)
new_coin = 12 / 25        # newly discovered coins (until the model suggests otherwise)

# --- PER-COIN thresholds (they override the default). Format:  SYMBOL = UP / DOWN ---
# TAO/HYPE/SPCXx = suggested by suggest_thresholds.py (p85 volatility, Jun 16) -- provisional.
BTC   = 6 / 10       # manual
TAO   = 8.5 / 6.7    # Bittensor (volatile)
HYPE  = 8.1 / 7.4    # Hyperliquid (lowered DOWN threshold from 9.6% to 7.4%)
SPCX  = 4.7 / 3.0    # SpaceX (model)

# --- General settings ---
# Notification rate-limit (strictly for outgoing notifications; price verification runs every price_scan_seconds).
cooldown_minutes       = 180    # Aug 21: 30->180 to stay well under ntfy.sh's ~250/day cap.
# Hybrid escalation during cooldown: allow immediate re-notification if the move worsens by at least
# (threshold * escalation_step_ratio) beyond the last notified move (0 disables escalation).
# Examples at 0.35: HYPE down 7.4% -> +2.59pp steps (-7.4% -> -10.0% -> -12.6%); BTC down 10% -> +3.5pp.
escalation_step_ratio  = 0.35
lookback_hours         = 24     # The price analysis window.
max_monitored          = 8      # Aug 21: 20->8 (reduce notification volume below the ntfy cap)
max_new_coins          = 15     # how many new coins to track
new_coins_scan_seconds = 3600   # how often to scan for new coins
price_scan_seconds     = 60     # how often to verify prices and refresh the local watcher cache
