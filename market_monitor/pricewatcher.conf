# ============================================================================
# pricewatcher.conf -- configuration for market_monitor/pricewatcher.py.
# Plain text, one line = one setting.  # = a comment (inline too).
# ============================================================================

# --- Watchlist: coins monitored and alerted on (sole source of truth for pricewatcher) ---
watch = BTC, TAO, HYPE, SPCX

# --- New-coin discovery: no = watchlist only (no alerts about brand-new coins) ---
discover_new_coins = no

# --- Sources (used only if discover_new_coins = yes) ---
sources = coinmarketcap, coingecko

# --- Alert thresholds:  NAME = UP% / DOWN% ---
#   UP%   = alert when the price has RISEN X% above the 24h LOW
#   DOWN% = alert when the price has FALLEN X% below the 24h HIGH
default  = 4.1 / 7.5      # coins without a per-coin override
new_coin = 12 / 25        # newly discovered coins (when discover_new_coins = yes)

# --- Per-coin thresholds (override default). Format:  SYMBOL = UP / DOWN ---
# Suggested baseline via verify_tools/gen_alert_thresholds.py, tuned manually as needed.
BTC   = 6 / 6.5      # Bitcoin (~p95 24h move; escalates -6.5% -> -8.8% -> -11.1%)
TAO   = 8.5 / 6.7    # Bittensor (volatile)
HYPE  = 8.1 / 7.4    # Hyperliquid
SPCX  = 4.7 / 3.0    # SpaceX

# --- General settings ---
# Notification rate-limit (strictly for outgoing notifications; price verification runs every price_scan_seconds).
cooldown_minutes       = 180    # Per-symbol/direction notification cooldown (keeps ntfy volume well under daily cap)
# Hybrid escalation during cooldown: allow immediate re-notification if the move worsens by at least
# (threshold * escalation_step_ratio) beyond the last notified move (0 disables escalation).
# Examples at 0.35: HYPE down 7.4% -> +2.59pp steps (-7.4% -> -10.0% -> -12.6%); BTC down 6.5% -> +2.28pp steps.
escalation_step_ratio  = 0.35
lookback_hours         = 24     # Rolling price analysis window
retention_days         = 7      # Days kept in cache_watcher_all_price.json (kept at 7d for AI 7d fallback; >=5d avoids partial-7d)
max_new_coins          = 15     # Cap on newly discovered coins (applied only when discover_new_coins = yes)
new_coins_scan_seconds = 3600   # New-coin discovery interval
price_scan_seconds     = 60     # Price verification & watcher cache refresh interval
