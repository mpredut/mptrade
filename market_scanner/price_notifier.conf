# ============================================================================
# market_alerts.conf — configuration for the alert monitor (new coins plus price thresholds).
# Plain text, one line = one setting.  # = a comment (inline too).
# ============================================================================

# --- Watchlist: the coins tracked (ONLY these get alerts) ---
# SPCX = tokenised SpaceX (what the fetcher RESOLVES; SPCXX/xstocks do NOT resolve). HYPE is kept.
# You can also add NVDA (tokenised) etc. Stocks without a token (RGNT, Hynix) -> price_alert.py only (Yahoo).
watch = BTC, TAO, HYPE, SPCX

# --- New-coin discovery: no = watchlist only (no alerts about brand-new coins) ---
discover_new_coins = no

# --- Sources (used only if discover_new_coins = yes) ---
sources = coinmarketcap, coingecko

# --- Alert thresholds:  NAME = UP% / DOWN% ---
#   UP%   = alert when the price has RISEN X% above the 24h LOW
#   DOWN% = alert when the price has FALLEN X% below the 24h HIGH
default  = 4.1 / 7.5      # the normal coins (without their own threshold)
new_coin = 12 / 25        # monede nou-descoperite (pana modelul sugereaza altceva)

# --- PER-COIN thresholds (they override the default). Format:  SYMBOL = UP / DOWN ---
# TAO/HYPE/SPCXX = sugerate de suggest_thresholds.py (volatilitate p85, 16 iun) — provizorii.
BTC   = 6 / 10       # manual
TAO   = 8.5 / 6.7    # Bittensor (volatil)
HYPE  = 8.1 / 9.6    # Hyperliquid
SPCX  = 4.7 / 3.0    # SpaceX (model)

# --- Setari generale ---
cooldown_minutes       = 180    # 21 aug: 30->180. market_alerts epuiza cota ntfy.sh
                                # (~449 pushes/day, a cap of ~250/day per IP -> it blocked ALL the
                                # critical alerts). See also max_monitored 20->8 below.
lookback_hours         = 24     # The price analysis window.
max_monitored          = 8      # 21 aug: 20->8 (reduce volumul de notificari sub plafonul ntfy)
max_new_coins          = 15     # cate monede noi urmarim
new_coins_scan_seconds = 3600   # cat de des cautam monede noi
price_scan_seconds     = 60     # cat de des verificam preturile
