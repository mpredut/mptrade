# July 23: mt.buy_budget/mt.max_budget below originally used INLINE comments
# (on the same line as the value) — configparser does NOT strip them by default (only
# comments on their own line), so the value parsed was literally the string
# "200      # USD per buy..." -> float() failed -> it fell back to the default (None,
# i.e. WITHOUT real protection) ever since this file was written. Fixed by
# moving the comments onto their own lines (the convention of the rest of the file).
# USD per buy -> qty = budget/price (no longer hardcoded to 1 HYPE)
mt.ref               = last
mt.buy_budget        = 200
# total USD exposure cap (the HYPEUSD quote currency): do not buy if the value
# of the position (avail_qty * price) >= this cap. 30 Jul: 700 -> 5000 (user request;
# the current ~2223 USD position was ~3x over the old 700 cap, so it was blocked).
mt.max_budget        = 5000

