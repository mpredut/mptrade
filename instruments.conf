# Central instrument registry: identity, role membership, and per-coin policy.
# Every role is explicit. enabled=no excludes the instrument from all consumers.
# Binance market-data caches and TradeAll trend tracking include all enabled
# Binance instruments; only role.tradeall_fire authorizes TradeAll order attempts.
# role.mt selects monitortrades; its budgets and thresholds remain in this section.
# role.archive selects the long price archive; role.rtrade selects its single pair.
# trailing.pct is mandatory for role.trailing. Peak, warm-up, and pending orders
# remain runtime state in cachedb/trailing_state.json; never seed peaks from config.
# Changes require restarting affected fleet processes AND independent bots.
# Disabled HL/T212 entries stay disabled to avoid concurrent position managers.

[BINANCE_BTC]
role.mt = yes
role.tradeall_fire = yes
role.kalman_primary = yes
role.trailing = yes
role.assetguardian = yes
role.archive = yes
role.rtrade = no
role.force_sell = yes
tradeall.kalman_mode = strict
trailing.pct = 16
trailing.rebuy = yes
provider     = binance
symbol       = BTCUSDC
base         = BTC
quote        = USDC
enabled      = yes
isolation    = own_ledger
market_hours = 24x7
# BACKTEST: 5.0, 7.0, 8.0, 9.0
mt.gain              = 5.25
# BACKTEST: 2.3, 3.3, 3.8, 4.3
mt.lost              = 2.925
# BACKTEST: 4, 7, 10, 14
mt.maxage_days       = 10.5
# BACKTEST: 12, 17, 20, 24
mt.hardtp            = 17
# BACKTEST: 0.3, 0.5, 0.65, 0.8
mt.hardtp_fraction   = 0.5
mt.hardtp_cooldown_h = 6
mt.ref               = last
# 23 Jul: buy_budget/max_budget added after a backtest on replay (offline/research/
# monitortrades_backtest/) — WITHOUT them, "buy again" in monitor_price_and_trade
# buys qty=1 (1 whole BTC, ~$65-111k over the history tested) with no total
# cap at all. buy_budget=250 controls the size per buy (Kraken HYPE already has
# the same pattern); max_budget=3500 = validated on TAO (net -$45 versus buy & hold -$420,
# all cycles closed correctly) after averaging the value found through the
# backtest (~2000, stable zone 1500-3000) and the proposed value (5000, which
# alone gave a net of -$5279 with 0 sells — the remaining position stayed stuck).
mt.buy_budget        = 250
mt.max_budget        = 3500

