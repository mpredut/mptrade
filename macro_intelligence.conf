binance_btc_ticker_url = https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT
deribit_dvol_url_template = https://www.deribit.com/api/v2/public/get_volatility_index_data?currency={currency}&start_timestamp={start_ms}&end_timestamp={end_ms}&resolution=3600
deribit_hist_vol_url_template = https://www.deribit.com/api/v2/public/get_historical_volatility?currency={currency}
deribit_options_book_url_template = https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency={currency}&kind=option
