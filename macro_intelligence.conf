# ==============================================================================
# macro_intelligence.conf — Declarative SSOT Configuration for Macro, Sentiment,
# Specialized Multi-Source Feeds, Dynamic Crisis Lexicon & Global Trading Sessions
# ==============================================================================
# Read by intelligence/macro_sentiment_ssot.py. Eliminates hardcoded URLs,
# keyword tuples, cache filenames, and session schedules from Python code.

[feeds]
# Curated specialized editorial RSS feeds (World Geopolitics, Global Macro, Central Banks, Markets).
# No keyword query is needed for these feeds because editors curate top breaking stories directly.
specialized_rss_urls =
    https://feeds.bbci.co.uk/news/world/rss.xml
    https://www.aljazeera.com/xml/rss/all.xml
    https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114
    https://feeds.content.dowjones.io/public/rss/mw_topstories
    https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-US&gl=US&ceid=US:en
    https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en

# Template for dynamic search feed built at runtime from active crisis terms + seed lexicon
dynamic_search_rss_template = https://news.google.com/rss/search?q=({query})+when:6h&hl=en-US&gl=US&ceid=US:en
dynamic_search_max_terms = 16

# External telemetry API endpoints
fear_greed_endpoint_url = https://api.alternative.me/fng/?limit=14
market_breadth_endpoint_url = https://api.binance.com/api/v3/ticker/24hr

[cache_files]
sentiment_eval_files = sentiment_eval.json
sentiment_advisor_files = sentiment_eval.json
geopolitical_eval_file = geopolitical_eval.json
geopolitical_eval_files = geopolitical_eval.json
fear_greed_files = fear_greed_collect.json
market_breadth_files = market_breadth_collect.json
news_feed_files = news_feed_collect.json
dynamic_lexicon_file = macro_lexicon_collect.json
macro_heartbeat_file = macro_analyzer.heartbeat
whale_snapshot_prefix = whale_snapshot_

[intervals]
default_sentiment_interval_sec = 10800.0
min_dynamic_sentiment_interval_sec = 1800.0
max_dynamic_sentiment_interval_sec = 16200.0
sentiment_checkpoint_cooldown_sec = 2700.0

default_geopolitical_interval_sec = 16200.0
min_dynamic_geopolitical_interval_sec = 900.0
max_dynamic_geopolitical_interval_sec = 21600.0
default_news_rolling_window_sec = 14400.0
default_fallback_retry_ttl_sec = 120.0
dynamic_lexicon_ttl_sec = 259200.0

[taxonomies]
market_biases = BULLISH, NEUTRAL, CAUTION, BEARISH
risk_levels = LOW, MODERATE, HIGH, EXTREME
recommended_actions = ACCUMULATE, HOLD, TRIM_PROFITS, DEFENSIVE
breadth_regimes = EUPHORIC_BLOWOFF, PANIC_WASHOUT, BULLISH_BREADTH, BEARISH_BREADTH, NEUTRAL
threat_levels = NORMAL, ELEVATED, CRITICAL_SHOCK
recommended_brakes = NONE, DOWNSCALE_50, HARD_VETO_NEW_BUYS

bias_aliases = BULL:BULLISH, LONG:BULLISH, RISK_ON:BULLISH, CAUTIOUS:CAUTION, DEFENSIVE:CAUTION, BEAR:BEARISH, SHORT:BEARISH, RISK_OFF:BEARISH
risk_aliases = MINIMAL:LOW, NORMAL:MODERATE, MEDIUM:MODERATE, ELEVATED:HIGH, CRITICAL:EXTREME, SEVERE:EXTREME
action_aliases = BUY:ACCUMULATE, ACCUMULATION:ACCUMULATE, WAIT:HOLD, NEUTRAL:HOLD, TRIM:TRIM_PROFITS, TAKE_PROFIT:TRIM_PROFITS, REDUCE:TRIM_PROFITS, PROTECT:DEFENSIVE, HALT:DEFENSIVE, RISK_OFF:DEFENSIVE
threat_aliases = LOW:NORMAL, CALM:NORMAL, MODERATE:ELEVATED, HIGH:ELEVATED, WARNING:ELEVATED, CRITICAL:CRITICAL_SHOCK, EXTREME:CRITICAL_SHOCK, SHOCK:CRITICAL_SHOCK
brake_aliases = ALLOW:NONE, PASS:NONE, APPROVE:NONE, DOWNSCALE:DOWNSCALE_50, DOWNSCALE_QTY:DOWNSCALE_50, REDUCE_QTY:DOWNSCALE_50, SCALE_DOWN:DOWNSCALE_50, HARD_VETO:HARD_VETO_NEW_BUYS, VETO:HARD_VETO_NEW_BUYS, BLOCK:HARD_VETO_NEW_BUYS, REJECT:HARD_VETO_NEW_BUYS, HALT_ALL:HARD_VETO_NEW_BUYS

breadth_excluded_bases = USDC, FDUSD, TUSD, USDP, DAI, BUSD, EUR, AEUR, PAXG, WBTC
breadth_quote_suffixes = USDT, USDC, FDUSD, TUSD, BUSD

[lexicon_seed]
