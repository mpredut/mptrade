crypto_executor_interval_sec = 360.0
share_executor_interval_mult = 5.0
ui_sync_interval_mult = 2.0
ui_sync_idle_mult = 1/3
orderbook_interval_mult = 1/24
derivatives_interval_mult = 1/12
whale_interval_mult = 1/6
news_interval_mult = 1/3
breadth_interval_mult = 5/6
macro_benchmarks_interval_mult = 5/6
fear_greed_interval_mult = 5.0
sensor_stale_age_mult = 11/12
unfilled_order_cancel_grace_mult = 5/3

default_sentiment_interval_mult = 30.0
min_dynamic_sentiment_interval_mult = 5.0
