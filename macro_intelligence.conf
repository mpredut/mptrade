cboe_delayed_options_url_template = https://cdn.cboe.com/api/global/delayed_quotes/options/{option_path}
cboe_index_tickers = SPX, VIX, NDX, RUT, DJX, XSP
macro_benchmark_specs = SPY:SPY:usd, QQQ:QQQ:usd, ES=F:ES=F:usd, NQ=F:NQ=F:usd, VIX:^VIX:index, DXY:DX-Y.NYB:index, US10Y:^TNX:yield_pct, IBIT:IBIT:usd

# Static encyclopedia and dictionary reference domains excluded from breaking news feeds
excluded_reference_sources = britannica, wikipedia, investopedia, merriam-webster, dictionary.com

[cache_files]
